name: Release Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NPM_CLI_VERSION: "11.10.0"
      DENO_PUBLISH_VERSION: "2.9.3"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm CLI
        run: |
          npm install --global "npm@${NPM_CLI_VERSION}"
          test "$(npm --version)" = "${NPM_CLI_VERSION}"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v${{ env.DENO_PUBLISH_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release qualification
        run: npm run qualification:release

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: JSR dry-run
        run: deno publish --dry-run

      - name: Inspect npm publication state
        run: node scripts/release/check-registry-version.mjs --registry=npm --require-present

      - name: Inspect JSR publication state
        run: node scripts/release/check-registry-version.mjs --registry=jsr --require-present

      - name: Report outdated dependencies
        continue-on-error: true
        run: npm run deps:outdated
