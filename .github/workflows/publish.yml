name: Publish

on:
  release:
    types:
      - published

concurrency:
  group: publish-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Resolve publish metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          jsr_version="$(jq -r '.version' jsr.json)"

          if [ -z "${package_name}" ] || [ "${package_name}" = "null" ]; then
            echo "::error::Missing package name in package.json"
            exit 1
          fi

          if [ "${package_version}" != "${jsr_version}" ]; then
            echo "::error::Version mismatch: package.json=${package_version} jsr.json=${jsr_version}"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"

          if ! printf '%s' "${expected_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected semantic version x.y.z, got '${expected_version}'"
            exit 1
          fi

          if [ "${expected_version}" != "${package_version}" ]; then
            echo "::error::Version mismatch: expected=${expected_version} package=${package_version}"
            exit 1
          fi

          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "::error::Release tag must be v${package_version}, got ${RELEASE_TAG}"
            exit 1
          fi

          checkout_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          main_commit="$(git rev-parse origin/main)"
          if [ "${checkout_commit}" != "${tag_commit}" ] || [ "${checkout_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::Checkout, release tag, and event SHA do not identify the same commit"
            exit 1
          fi
          if [ "${checkout_commit}" != "${main_commit}" ]; then
            echo "::error::Release tag must identify the current main commit"
            exit 1
          fi

          mkdir -p publish-artifacts
          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
            echo "commit_sha=${checkout_commit}"
            echo "release_tag=${RELEASE_TAG}"
            echo "main_commit=${main_commit}"
          } | tee publish-artifacts/publish-summary.txt

          {
            echo "package_name=${package_name}"
            echo "version=${package_version}"
            echo "commit_sha=${checkout_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Print publish metadata
        run: |
          echo "package=${{ steps.meta.outputs.package_name }}"
          echo "version=${{ steps.meta.outputs.version }}"
          echo "commit=${{ steps.meta.outputs.commit_sha }}"

      - name: Run release qualification
        run: npm run qualification:release

      - name: Verify qualified revision
        env:
          QUALIFIED_COMMIT: ${{ steps.meta.outputs.commit_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${QUALIFIED_COMMIT}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${QUALIFIED_COMMIT}"
          test "$(git rev-parse origin/main)" = "${QUALIFIED_COMMIT}"
          git diff --quiet
          git diff --cached --quiet
          printf 'qualified_commit=%s\n' "${QUALIFIED_COMMIT}" >> publish-artifacts/publish-summary.txt

      - name: Ensure npm version does not already exist
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npm_view_output="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>&1)"
          npm_view_status=$?
          set -e

          if [ ${npm_view_status} -eq 0 ]; then
            echo "::error::npm version already exists: ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

          if printf '%s' "${npm_view_output}" | grep -Eqi 'E404|404 Not Found|not found'; then
            echo "npm version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
          else
            echo "::error::Unable to verify npm version state for ${PACKAGE_NAME}@${VERSION}"
            echo "${npm_view_output}"
            exit 1
          fi

      - name: Ensure JSR version does not already exist
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          jsr_info_output="$(npx -y jsr info "${PACKAGE_NAME}@${VERSION}" 2>&1)"
          jsr_info_status=$?
          set -e

          if [ ${jsr_info_status} -eq 0 ]; then
            echo "::error::JSR version already exists: ${PACKAGE_NAME}@${VERSION}"
            echo "${jsr_info_output}"
            exit 1
          fi

          if printf '%s' "${jsr_info_output}" | grep -Eqi '404|not found|Received 404'; then
            echo "JSR version does not exist yet: ${PACKAGE_NAME}@${VERSION}"
          else
            echo "::error::Unable to verify JSR version state for ${PACKAGE_NAME}@${VERSION}"
            echo "${jsr_info_output}"
            exit 1
          fi

      - name: Generate npm pack manifest
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          printf '%s\n' "${pack_json}" > publish-artifacts/npm-pack.json
          tarball="$(printf '%s\n' "${pack_json}" | node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(data[0].filename);')"
          tar -tzf "${tarball}" | sort > publish-artifacts/npm-pack-file-list.txt
          rm -f "${tarball}"

      - name: Run JSR publish dry-run
        run: |
          set -euo pipefail
          npx -y jsr publish --dry-run --allow-dirty 2>&1 | tee publish-artifacts/jsr-publish-dry-run.txt

      - name: Upload publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ steps.meta.outputs.version }}
          path: |
            publish-artifacts/
            reports/**

      - name: Ensure tokenless npm auth for OIDC publish
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish npm (trusted publishing)
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

      - name: Publish JSR
        run: npx -y jsr publish --allow-dirty --provenance
