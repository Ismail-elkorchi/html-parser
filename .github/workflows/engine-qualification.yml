name: Engine qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release evaluation
        run: npm run eval:release

      - name: Qualify the complete WPT tree corpus
        run: npm run qualification:wpt

      - name: Compare Node, Deno, and Bun
        run: npm run qualification:runtime

      - name: Run mutation qualification
        run: npm run mutation:pilot

      - name: Run deep and error-heavy resource evidence
        run: npm run test:bench:independent-product

      - name: Compare tagged and candidate performance
        run: npm run qualification:performance

      - name: Verify package types from an offline production install
        run: npm run test:packed-types

      - name: Verify dependency, import, license, audit, SBOM, and provenance evidence
        run: npm run qualification:supply-chain

      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-qualification-reports
          if-no-files-found: error
          path: reports/**
